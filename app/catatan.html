<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; object-src 'none'; frame-ancestors 'none';">
<link rel="manifest" href="manifest.json">
<title>📝 Catatan — Toko App</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#0f172a; --text:#fff; --text-dim:#94a3b8; --border:rgba(255,255,255,.1); --primary:#6366f1; --accent:#a855f7; }
  html, body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:linear-gradient(135deg,var(--bg),#1e293b); color:var(--text); min-height:100vh; }
  .topbar { display:flex; align-items:center; gap:12px; padding:16px 20px; padding-top:calc(16px + env(safe-area-inset-top,0px)); background:rgba(15,23,42,.95); position:sticky; top:0; z-index:10; border-bottom:1px solid var(--border); }
  .back { background:rgba(255,255,255,.1); border:none; color:#fff; width:38px; height:38px; border-radius:10px; font-size:18px; cursor:pointer; }
  .topbar h1 { font-size:18px; }
  .container { padding:20px; }
  textarea { width:100%; background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:14px; padding:14px 16px; color:#fff; font-size:15px; outline:none; resize:vertical; min-height:100px; font-family:inherit; }
  textarea:focus { border-color:var(--primary); }
  .btn { margin-top:12px; width:100%; padding:14px; background:linear-gradient(90deg,#fbbf24,#f59e0b); border:none; border-radius:12px; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .notes-list { margin-top:24px; display:flex; flex-direction:column; gap:10px; }
  .note-item { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:14px 16px; position:relative; }
  .note-item p { font-size:14px; line-height:1.5; word-wrap:break-word; padding-right:30px; white-space:pre-wrap; }
  .note-item small { display:block; color:#64748b; font-size:11px; margin-top:6px; }
  .note-delete { position:absolute; top:10px; right:10px; background:transparent; border:none; color:#f87171; font-size:18px; cursor:pointer; padding:4px 8px; }
  .empty { text-align:center; color:#64748b; padding:40px 0; font-size:14px; }
  .lock-screen { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9999; padding:20px; }
  .lock-screen[hidden] { display:none; }
  .lock-box { width:100%; max-width:320px; text-align:center; }
  .lock-box h2 { font-size:22px; margin-bottom:8px; }
  .lock-box p { color:var(--text-dim); font-size:13px; margin-bottom:20px; }
  .pin-input { width:100%; padding:16px; background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:12px; color:#fff; font-size:24px; letter-spacing:8px; text-align:center; outline:none; font-family:inherit; }
  .lock-btn { margin-top:16px; width:100%; padding:14px; background:linear-gradient(90deg,var(--primary),var(--accent)); border:none; border-radius:12px; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  #main[hidden] { display:none; }
</style>
</head>
<body>

<div id="lockScreen" class="lock-screen" hidden>
  <div class="lock-box">
    <h2>🔒 Terkunci</h2>
    <p id="lockMsg">Masukkan PIN untuk membuka</p>
    <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="••••">
    <button class="lock-btn" id="unlockBtn">Buka</button>
  </div>
</div>

<div id="main" hidden>
  <div class="topbar">
    <button class="back" onclick="location.href='index.html'">←</button>
    <h1>📝 Catatan</h1>
  </div>
  <div class="container">
    <textarea id="noteInput" placeholder="Tulis catatan (akan dienkripsi)..." maxlength="5000"></textarea>
    <button class="btn" id="btnSimpan">💾 Simpan (Terenkripsi)</button>
    <div class="notes-list" id="notesList"></div>
  </div>
</div>

<script src="shared/dexie.min.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/crypto.js"></script>
<script src="shared/auth.js"></script>

<script>
window.addEventListener('app-ready', async () => {
  const db = Auth.db;
  const input = document.getElementById('noteInput');
  const list = document.getElementById('notesList');

  async function render() {
    const notes = await db.notes.orderBy('date').reverse().toArray();
    if (!notes.length) { list.innerHTML = '<div class="empty">Belum ada catatan</div>'; return; }
    const decrypted = await Promise.all(notes.map(async n => {
      try { return { ...n, text: await CRYPTO.decrypt(Auth.getKey(), n.cipher) }; }
      catch { return { ...n, text: '⚠️ Gagal dekripsi' }; }
    }));
    list.innerHTML = decrypted.map(n => `
      <div class="note-item">
        <p>${UI.escapeHtml(n.text)}</p>
        <small>${UI.escapeHtml(new Date(n.date).toLocaleString('id-ID'))}</small>
        <button class="note-delete" data-id="${n.id}">✕</button>
      </div>
    `).join('');
    list.querySelectorAll('.note-delete').forEach(btn => {
      btn.addEventListener('click', async () => {
        const ok = await UI.confirmDialog('Hapus catatan ini?');
        if (!ok) return;
        await db.notes.delete(Number(btn.dataset.id));
        UI.toast('Catatan dihapus', 'success');
        render();
      });
    });
  }

  document.getElementById('btnSimpan').addEventListener('click', async () => {
    const text = UI.sanitizeText(input.value, 5000);
    if (!text) { UI.toast('Catatan kosong', 'warn'); return; }
    try {
      const cipher = await CRYPTO.encrypt(Auth.getKey(), text);
      await db.notes.add({ cipher, date: new Date().toISOString() });
      input.value = '';
      UI.toast('Catatan tersimpan', 'success');
      render();
    } catch (e) { UI.toast('Gagal simpan', 'error'); }
  });

  render();
});
</script>
</body>
</html>
