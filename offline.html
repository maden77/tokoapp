<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self';
  object-src 'none';
  base-uri 'self';
  frame-ancestors 'none';
">

<style>
  body {
    background: #0f172a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
  <div>
    <h1>📡 Offline</h1>
    <p>Anda sedang offline.<br>Data lokal tetap bisa diakses dari aplikasi yang sudah di-install.</p>
  </div>

</html>
