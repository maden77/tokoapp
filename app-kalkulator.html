<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; object-src 'none'; frame-ancestors 'none';">
<link rel="manifest" href="manifest.json">
<title>🧮 Kalkulator — Toko App</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#0f172a; --text:#fff; --text-dim:#94a3b8; --border:rgba(255,255,255,.1); --primary:#6366f1; --accent:#a855f7; }
  html, body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:linear-gradient(135deg,var(--bg),#1e293b); color:var(--text); min-height:100vh; }
  .topbar { display:flex; align-items:center; gap:12px; padding:16px 20px; padding-top:calc(16px + env(safe-area-inset-top,0px)); background:rgba(15,23,42,.95); position:sticky; top:0; z-index:10; border-bottom:1px solid var(--border); }
  .back { background:rgba(255,255,255,.1); border:none; color:#fff; width:38px; height:38px; border-radius:10px; font-size:18px; cursor:pointer; }
  .topbar h1 { font-size:18px; }
  .container { padding:20px; }
  .display { background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; min-height:100px; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end; }
  .expr { font-size:16px; color:#94a3b8; text-align:right; margin-bottom:8px; font-family:'Courier New',monospace; word-wrap:break-word; min-height:22px; }
  .result { font-size:36px; font-weight:700; text-align:right; font-family:'Courier New',monospace; word-wrap:break-word; min-height:42px; }
  .buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .btn { padding:18px 8px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1); border-radius:12px; color:#fff; font-size:20px; font-weight:600; cursor:pointer; font-family:inherit; transition:transform .1s,background .15s; }
  .btn:active { transform:scale(.95); background:rgba(255,255,255,.15); }
  .btn.op { background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(168,85,247,.25)); color:#a5b4fc; border-color:rgba(99,102,241,.4); }
  .btn.eq { background:linear-gradient(135deg,#8b5cf6,#ec4899); border:none; }
  .btn.danger { background:linear-gradient(135deg,#dc2626,#f59e0b); border:none; }
  .history { margin-top:24px; }
  .history-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .history-header h3 { font-size:15px; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; }
  .btn-dl { padding:8px 14px; background:linear-gradient(90deg,#10b981,#059669); border:none; border-radius:10px; color:#fff; font-size:12px; font-weight:600; cursor:pointer; }
  .btn-clr { padding:8px 14px; background:rgba(220,38,38,.2); border:1px solid rgba(220,38,38,.4); border-radius:10px; color:#fca5a5; font-size:12px; cursor:pointer; margin-right:8px; }
  .h-item { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:14px; margin-bottom:10px; font-family:'Courier New',monospace; font-size:13px; line-height:1.6; white-space:pre-wrap; word-wrap:break-word; color:#cbd5e1; position:relative; }
  .h-result { color:#a5b4fc; font-weight:700; font-size:16px; display:block; margin-top:6px; }
  .h-del { position:absolute; top:8px; right:8px; background:transparent; border:none; color:#f87171; font-size:16px; cursor:pointer; padding:4px 8px; }
  .empty { text-align:center; color:#64748b; padding:40px 0; font-size:14px; }
  .lock-screen { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9999; padding:20px; }
  .lock-screen.hidden { display:none !important; }
  .lock-box { width:100%; max-width:320px; text-align:center; }
  .lock-box h2 { font-size:22px; margin-bottom:8px; }
  .lock-box p { color:var(--text-dim); font-size:13px; margin-bottom:20px; }
  .pin-input { width:100%; padding:16px; background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:12px; color:#fff; font-size:24px; letter-spacing:8px; text-align:center; outline:none; font-family:inherit; }
  .pin-input:focus { border-color:var(--primary); }
  .lock-btn { margin-top:16px; width:100%; padding:14px; background:linear-gradient(90deg,var(--primary),var(--accent)); border:none; border-radius:12px; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .main-app { display:none; }
  .main-app.visible { display:block; }
</style>
</head>
<body>

<div id="lockScreen" class="lock-screen">
  <div class="lock-box">
    <h2 id="lockTitle">🔐 Buat PIN</h2>
    <p id="lockMsg">PIN baru (min 6 digit) untuk mengenkripsi</p>
    <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="12" placeholder="PIN baru">
    <button class="lock-btn" id="unlockBtn">Buat PIN</button>
  </div>
</div>

<div id="main" class="main-app">
  <div class="topbar">
    <button class="back" onclick="location.href='index.html'">←</button>
    <h1>🧮 Kalkulator</h1>
  </div>
  <div class="container">
    <div class="display">
      <div class="expr" id="expr">0</div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn danger" data-action="clear">C</button>
      <button class="btn op" data-action="backspace">⌫</button>
      <button class="btn op" data-action="open">(</button>
      <button class="btn op" data-val="÷">÷</button>
      <button class="btn" data-val="7">7</button>
      <button class="btn" data-val="8">8</button>
      <button class="btn" data-val="9">9</button>
      <button class="btn op" data-val="×">×</button>
      <button class="btn" data-val="4">4</button>
      <button class="btn" data-val="5">5</button>
      <button class="btn" data-val="6">6</button>
      <button class="btn op" data-val="-">−</button>
      <button class="btn" data-val="1">1</button>
      <button class="btn" data-val="2">2</button>
      <button class="btn" data-val="3">3</button>
      <button class="btn op" data-val="+">+</button>
      <button class="btn" data-action="close">)</button>
      <button class="btn" data-val="0">0</button>
      <button class="btn" data-val=".">.</button>
      <button class="btn eq" data-action="equals">=</button>
    </div>
    <div class="history">
      <div class="history-header">
        <h3>📜 Riwayat</h3>
        <div>
          <button class="btn-clr" id="btnClearHistory">🗑️</button>
          <button class="btn-dl" id="btnDownload">⬇️ Download</button>
        </div>
      </div>
      <div id="historyList"></div>
    </div>
  </div>
</div>

<script src="shared/dexie.min.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/crypto.js"></script>

<script>
'use strict';

// ============================================================
//  KALKULATOR — Format Indonesia + Breakdown
// ============================================================
function fmt(n) {
  if (!isFinite(n)) return '∞';
  const r = Math.round(n * 1e10) / 1e10;
  const [i, d] = r.toString().split('.');
  const f = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return d ? f + ',' + d : f;
}

function tokenize(e) {
  const t = []; let i = 0;
  while (i < e.length) {
    const c = e[i];
    if (c === ' ') { i++; continue; }
    if (/[0-9.,]/.test(c)) {
      let n = '';
      while (i < e.length && /[0-9.,]/.test(e[i])) { n += e[i] === ',' ? '.' : e[i]; i++; }
      t.push({ type: 'number', value: parseFloat(n) });
    } else if ('+-×÷()'.includes(c)) { t.push({ type: 'op', value: c }); i++; }
    else throw new Error('Karakter: ' + c);
  }
  return t;
}

function parse(tk) {
  let p = 0;
  const peek = () => tk[p];
  const consume = () => tk[p++];
  function expr() {
    let l = term();
    while (peek() && (peek().value === '+' || peek().value === '-')) {
      const op = consume().value;
      const r = term();
      l = op === '+' ? l + r : l - r;
    }
    return l;
  }
  function term() {
    let l = factor();
    while (peek() && (peek().value === '×' || peek().value === '÷')) {
      const op = consume().value;
      const r = factor();
      if (op === '÷' && r === 0) throw new Error('Tidak bisa dibagi 0');
      l = op === '×' ? l * r : l / r;
    }
    return l;
  }
  function factor() {
    const t = peek();
    if (!t) throw new Error('Ekspresi kosong');
    if (t.value === '-') { consume(); return -factor(); }
    if (t.value === '+') { consume(); return factor(); }
    if (t.value === '(') {
      consume();
      const v = expr();
      if (!peek() || peek().value !== ')') throw new Error('Kurung tidak ditutup');
      consume();
      return v;
    }
    if (t.type === 'number') { consume(); return t.value; }
    throw new Error('Invalid');
  }
  const r = expr();
  if (p < tk.length) throw new Error('Ekspresi tidak valid');
  return r;
}

function tokStr(t) { return t.map(x => x.type === 'number' ? fmt(x.value) : x.value).join(' '); }

function breakdown(tks) {
  const steps = [tokStr(tks)];
  const w = JSON.parse(JSON.stringify(tks));
  let safety = 50;
  while (safety-- > 0) {
    let o = -1, c = -1;
    for (let i = 0; i < w.length; i++) {
      if (w[i].value === '(') o = i;
      if (w[i].value === ')' && o >= 0) { c = i; break; }
    }
    if (o >= 0 && c >= 0) {
      const inner = w.slice(o + 1, c);
      const r = parse(inner);
      steps.push(tokStr(inner) + ' = ' + fmt(r));
      w.splice(o, c - o + 1, { type: 'number', value: r });
      continue;
    }
    let op = -1;
    for (let i = 0; i < w.length; i++) if (w[i].value === '×' || w[i].value === '÷') { op = i; break; }
    if (op >= 0) {
      const l = w[op-1], o2 = w[op], r = w[op+1];
      if (o2.value === '÷' && r.value === 0) throw new Error('Tidak bisa dibagi 0');
      const res = o2.value === '×' ? l.value * r.value : l.value / r.value;
      steps.push(fmt(l.value) + ' ' + o2.value + ' ' + fmt(r.value) + ' = ' + fmt(res));
      w.splice(op-1, 3, { type: 'number', value: res });
      continue;
    }
    let as = -1;
    for (let i = 1; i < w.length; i++) if (w[i].value === '+' || w[i].value === '-') { as = i; break; }
    if (as >= 0) {
      const l = w[as-1], o2 = w[as], r = w[as+1];
      const res = o2.value === '+' ? l.value + r.value : l.value - r.value;
      steps.push(fmt(l.value) + ' ' + o2.value + ' ' + fmt(r.value) + ' = ' + fmt(res));
      w.splice(as-1, 3, { type: 'number', value: res });
      continue;
    }
    break;
  }
  return steps;
}

function calc(e) {
  let n = e.replace(/,/g, '.').replace(/\s+/g, '');
  if (!n) throw new Error('Ekspresi kosong');
  const open = (n.match(/\(/g) || []).length;
  const close = (n.match(/\)/g) || []).length;
  for (let i = 0; i < open - close; i++) n += ')';
  const tk = tokenize(n);
  return { expression: e, result: parse(tk), resultFormatted: fmt(parse(tk)), breakdown: breakdown(tokenize(n)) };
}

// ============================================================
//  AUTH + APP
// ============================================================
const db = new Dexie('toko_app_db');
db.version(2).stores({
  notes:    '++id, date',
  photos:   '++id, date',
  meta:     'key',
  messages: '++id, date, type'
});

let cryptoKey = null;
let lockTimer = null;
const IDLE_MS = 3 * 60 * 1000;
const HIDDEN_GRACE_MS = 30 * 1000;
const $ = (s) => document.querySelector(s);

async function hasPIN() { return !!(await db.meta.get('pin')); }
async function setupPIN(pin) {
  const salt = await CRYPTO.createSalt();
  const key = await CRYPTO.deriveKey(pin, salt);
  const verifier = await CRYPTO.makeVerifier(key);
  await db.meta.put({ key: 'pin', salt: CRYPTO.bufToB64(salt), verifier });
  return key;
}
async function verifyPIN(pin) {
  const rec = await db.meta.get('pin');
  if (!rec) return null;
  const salt = new Uint8Array(CRYPTO.b64ToBuf(rec.salt));
  const key = await CRYPTO.deriveKey(pin, salt);
  return (await CRYPTO.checkVerifier(key, rec.verifier)) ? key : null;
}

function showMainApp() {
  $('#lockScreen').classList.add('hidden');
  $('#main').classList.add('visible');
  scheduleAutoLock();
  initApp();
}
function showLockScreen(mode) {
  $('#lockScreen').classList.remove('hidden');
  $('#main').classList.remove('visible');
  const title = $('#lockTitle'), msg = $('#lockMsg'), input = $('#pinInput'), btn = $('#unlockBtn');
  if (mode === 'setup') {
    title.textContent = '🔐 Buat PIN';
    msg.textContent = 'PIN baru (min 6 digit) untuk mengenkripsi';
    input.placeholder = 'PIN baru';
    btn.textContent = 'Buat PIN';
  } else {
    title.textContent = '🔒 Terkunci';
    msg.textContent = 'Masukkan PIN untuk membuka';
    input.placeholder = '••••';
    btn.textContent = 'Buka';
  }
  input.value = '';
  setTimeout(() => input.focus(), 100);
}
function scheduleAutoLock() {
  clearTimeout(lockTimer);
  lockTimer = setTimeout(() => { cryptoKey = null; showLockScreen('unlock'); }, IDLE_MS);
}

let appInit = false;
async function initApp() {
  if (appInit) return;
  appInit = true;

  const exprEl = $('#expr');
  const resultEl = $('#result');
  const historyList = $('#historyList');
  let cur = '';

  function upd() { exprEl.textContent = cur || '0'; }
  function prev() {
    if (!cur) { resultEl.textContent = '0'; return; }
    try { resultEl.textContent = calc(cur).resultFormatted; } catch {}
  }

  async function renderHistory() {
    const h = await db.meta.get('calc_history');
    const items = h ? h.value : [];
    if (!items.length) { historyList.innerHTML = '<div class="empty">Belum ada riwayat</div>'; return; }
    historyList.innerHTML = items.slice(0, 20).map((it, i) => `
      <div class="h-item">
        <button class="h-del" data-idx="${i}">✕</button>
        ${UI.escapeHtml(it.text)}
        <span class="h-result">= ${UI.escapeHtml(it.result)}</span>
      </div>
    `).join('');
    historyList.querySelectorAll('.h-del').forEach(b => {
      b.addEventListener('click', async () => {
        const h = await db.meta.get('calc_history');
        const items = h ? h.value : [];
        items.splice(Number(b.dataset.idx), 1);
        await db.meta.put({ key: 'calc_history', value: items });
        renderHistory();
      });
    });
  }

  async function saveH(r) {
    const h = await db.meta.get('calc_history');
    const items = h ? h.value : [];
    const text = [r.expression + ' = ' + r.resultFormatted, ...r.breakdown].join('\n');
    items.unshift({ text, expression: r.expression, result: r.resultFormatted, breakdown: r.breakdown, date: new Date().toISOString() });
    if (items.length > 100) items.length = 100;
    await db.meta.put({ key: 'calc_history', value: items });
    renderHistory();
  }

  document.querySelectorAll('.btn').forEach(b => {
    b.addEventListener('click', async () => {
      const a = b.dataset.action, v = b.dataset.val;
      if (a === 'clear') { cur = ''; resultEl.textContent = '0'; upd(); return; }
      if (a === 'backspace') { cur = cur.slice(0, -1); upd(); prev(); return; }
      if (a === 'equals') {
        if (!cur) return;
        try {
          const r = calc(cur);
          resultEl.textContent = r.resultFormatted;
          await saveH(r);
          cur = r.resultFormatted.replace(/\./g, '');
          upd();
        } catch (e) { UI.toast(e.message, 'error'); }
        return;
      }
      if (a === 'open') { cur += '('; upd(); prev(); return; }
      if (a === 'close') { cur += ')'; upd(); prev(); return; }
      if (v) { cur += v; upd(); prev(); }
    });
  });

  document.getElementById('btnDownload').addEventListener('click', async () => {
    const h = await db.meta.get('calc_history');
    const items = h ? h.value : [];
    if (!items.length) { UI.toast('Belum ada riwayat', 'warn'); return; }
    const header = '========================================\n  RIWAYAT KALKULATOR - TOKO APP\n  Diekspor: ' + new Date().toLocaleString('id-ID') + '\n  Total: ' + items.length + ' perhitungan\n========================================\n\n';
    const body = items.map((it, i) => `[${i+1}] ${new Date(it.date).toLocaleString('id-ID')}\n${it.text}\n${'─'.repeat(40)}\n`).join('\n');
    const blob = new Blob([header + body], { type: 'text/plain;charset=utf-8' });
    UI.downloadFile('riwayat-kalkulator-' + new Date().toISOString().slice(0,10) + '.txt', blob);
    UI.toast('File di-download', 'success');
  });

  document.getElementById('btnClearHistory').addEventListener('click', async () => {
    const ok = await UI.confirmDialog('Hapus semua riwayat?');
    if (!ok) return;
    await db.meta.put({ key: 'calc_history', value: [] });
    renderHistory();
  });

  document.addEventListener('keydown', (e) => {
    if (/^[0-9]$/.test(e.key)) cur += e.key;
    else if (e.key === '+' || e.key === '-') cur += e.key;
    else if (e.key === '*') cur += '×';
    else if (e.key === '/') cur += '÷';
    else if (e.key === '.') cur += '.';
    else if (e.key === '(' || e.key === ')') cur += e.key;
    else if (e.key === 'Enter' || e.key === '=') { document.querySelector('[data-action="equals"]').click(); return; }
    else if (e.key === 'Backspace') cur = cur.slice(0, -1);
    else if (e.key === 'Escape') { cur = ''; resultEl.textContent = '0'; upd(); return; }
    else return;
    upd(); prev();
  });

  upd();
  renderHistory();
}

// ---------- Boot ----------
window.addEventListener('DOMContentLoaded', async () => {
  const hasPin = await hasPIN();
  showLockScreen(hasPin ? 'unlock' : 'setup');

  $('#unlockBtn').addEventListener('click', async () => {
    const pin = $('#pinInput').value.trim();
    if (pin.length < 6) { UI.toast('PIN minimal 6 digit', 'warn'); return; }
    const isSetup = !(await hasPIN());

    if (isSetup) {
      const pin2 = await UI.promptDialog('Konfirmasi PIN:', { type: 'password', minLen: 6, placeholder: '••••••' });
      if (!pin2) return;
      if (pin !== pin2) { UI.toast('PIN tidak cocok', 'error'); return; }
      try { cryptoKey = await setupPIN(pin); UI.toast('PIN dibuat!', 'success'); showMainApp(); }
      catch (e) { console.error(e); UI.toast('Gagal buat PIN', 'error'); }
    } else {
      try {
        const key = await verifyPIN(pin);
        if (!key) { UI.toast('PIN salah', 'error'); $('#pinInput').value = ''; return; }
        cryptoKey = key;
        showMainApp();
      } catch (e) { console.error(e); UI.toast('Gagal buka', 'error'); }
    }
  });

  $('#pinInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('#unlockBtn').click();
  });

  ['click', 'keydown', 'touchstart', 'pointerdown'].forEach(evt => {
    document.addEventListener(evt, () => { if (cryptoKey) scheduleAutoLock(); }, { passive: true });
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && cryptoKey) {
      setTimeout(() => { if (document.hidden && cryptoKey) { cryptoKey = null; showLockScreen('unlock'); } }, HIDDEN_GRACE_MS);
    }
  });
});
</script>
</body>
</html>
