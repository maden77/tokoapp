<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="description" content="Toko App lokal-first: Catatan, Kamera, Kalkulator, Pesan">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 
  'unsafe-inline';
  img-src 'self' blob: data:;
  media-src 'self' blob:;
  connect-src 'self' wss://0.peerjs.com https://0.peerjs.com;
  font-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'self';
  frame-ancestors 'none';
  worker-src 'self';
  manifest-src 'self';
  upgrade-insecure-requests;
">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Toko App">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="shared/style.css">
<title>Toko App</title>
</head>
<body>

<!-- Root untuk SPA -->
<div id="app-root"></div>

<!-- Script loader -->
<script src="shared/dexie.min.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/crypto.js"></script>
<script src="shared/auth.js"></script>
<script src="shared/components.js"></script>
<script type="module" src="shared/router.js"></script>
<script>
  // Init router setelah semua loaded
  window.addEventListener('DOMContentLoaded', () => {
    Router.init();
  });
  
</script>
  <div id="debug-panel" style="position:fixed;top:0;left:0;right:0;background:#000;color:#0f0;padding:12px;font-family:monospace;font-size:12px;z-index:999999;max-height:50vh;overflow:auto;white-space:pre-wrap;"></div>
<script>
(function() {
  const panel = document.getElementById('debug-panel');
  const log = (m, color) => {
    panel.innerHTML += '<div style="color:' + (color || '#0f0') + ';">' + m + '</div>';
  };
  
  log('🟢 index.html loaded');
  
  window.addEventListener('error', (e) => {
    log('❌ ' + e.message, '#f00');
    log('   @ ' + e.filename + ':' + e.lineno, '#f00');
  });
  
  window.addEventListener('unhandledrejection', (e) => {
    log('❌ PROMISE: ' + (e.reason?.message || e.reason), '#f00');
  });
  
  window.addEventListener('load', () => {
    log('📦 window.load fired');
    
    setTimeout(() => {
      log('--- Setelah 2 detik ---', '#ff0');
      log('window.Auth: ' + (window.Auth ? '✅' : '❌'), window.Auth ? '#0f0' : '#f00');
      log('window.Router: ' + (window.Router ? '✅' : '❌'), window.Router ? '#0f0' : '#f00');
      log('window.CRYPTO: ' + (window.CRYPTO ? '✅' : '❌'), window.CRYPTO ? '#0f0' : '#f00');
      log('window.UI: ' + (window.UI ? '✅' : '❌'), window.UI ? '#0f0' : '#f00');
      log('window.Dexie: ' + (window.Dexie ? '✅' : '❌'), window.Dexie ? '#0f0' : '#f00');
      log('lock-screen: ' + (customElements.get('lock-screen') ? '✅' : '❌'), customElements.get('lock-screen') ? '#0f0' : '#f00');
      log('app-shell: ' + (customElements.get('app-shell') ? '✅' : '❌'), customElements.get('app-shell') ? '#0f0' : '#f00');
      
      const root = document.getElementById('app-root');
      log('app-root: ' + (root ? '✅ (' + root.children.length + ' children)' : '❌ NULL'), root ? '#0f0' : '#f00');
      
      const lock = document.querySelector('lock-screen');
      log('lock-screen element: ' + (lock ? 'ADA (hidden=' + lock.hidden + ')' : 'TIDAK ADA'));
    }, 2000);
  });
})();
</script>
</body>
</html>
