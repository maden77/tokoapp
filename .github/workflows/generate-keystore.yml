name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password keystore (min 6 karakter)'
        required: true
        type: string
      alias:
        description: 'Alias keystore'
        required: true
        default: 'tokoapp'
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        env:
          PASS: ${{ github.event.inputs.password }}
          ALIAS: ${{ github.event.inputs.alias }}
        run: |
          mkdir -p output
          keytool -genkeypair -v \
            -keystore output/android.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Toko App, OU=Dev, O=TokoApp, L=Jakarta, S=DKI, C=ID"

          base64 -w 0 output/android.keystore > output/keystore.b64

      - name: Show SHA256
        env:
          PASS: ${{ github.event.inputs.password }}
          ALIAS: ${{ github.event.inputs.alias }}
        run: |
          echo "===== SHA256 FINGERPRINT ====="
          keytool -list -v -keystore output/android.keystore \
            -alias "$ALIAS" -storepass "$PASS" | grep "SHA256:"
          echo "=============================="

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: output/android.keystore
          retention-days: 30

      - name: Upload Base64
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: output/keystore.b64
          retention-days: 30
