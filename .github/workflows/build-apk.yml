name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  CORDOVA_VERSION: '12.0.0'
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_HOME: /home/runner/android-sdk
  CMDLINE_TOOLS_VERSION: '11076708'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 📦 Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🤖 Setup Android SDK (Manual)
        run: |
          set -e
          echo "📥 Download Android command-line tools..."
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          echo "✅ Command-line tools extracted"

      - name: 📜 Accept licenses & Install packages
        run: |
          set -e
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "✅ SDK packages installed"

      - name: 🔧 Install Cordova
        run: |
          npm install -g cordova@${{ env.CORDOVA_VERSION }}
          cordova --version

      - name: 🔐 Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ KEYSTORE_BASE64 belum di-set!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          ls -lh android.keystore

      - name: 🔢 Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
            VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{print $1*10000 + $2*100 + $3}')
          else
            VERSION_NAME="1.0.0"
            VERSION_CODE="1"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📱 Version: $VERSION_NAME ($VERSION_CODE)"

      - name: 🌐 Detect Pages URL
        id: url
        run: |
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          REPO_NAME="${REPO##*/}"
          if [ "$REPO_NAME" = "$OWNER.github.io" ]; then
            URL="https://${OWNER}.github.io/"
          else
            URL="https://${OWNER}.github.io/${REPO_NAME}/"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "📱 PWA URL: $URL"

      - name: 🏗️ Create Cordova Project
        run: |
          cd /tmp
          cordova create tokoapp com.tokoapp.pwa "Toko App" --template=blank
          cd tokoapp
          echo "✅ Cordova project created"
          ls -la

      - name: 📝 Configure Cordova for PWA
        run: |
          cd /tmp/tokoapp
          
          # Set config.xml
          cat > config.xml << EOF
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.tokoapp.pwa" version="${{ steps.version.outputs.VERSION_NAME }}" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Toko App</name>
              <description>Toko App PWA</description>
              <author email="dev@example.com" href="https://example.com">
                  Developer
              </author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="Orientation" value="portrait" />
              <preference name="BackgroundColor" value="0xFF0F172A" />
              <preference name="StatusBarBackgroundColor" value="#0f172a" />
              <preference name="StatusBarStyle" value="lightcontent" />
              <preference name="Fullscreen" value="false" />
          </widget>
          EOF
          
          # Kosongkan folder www, isi dengan URL redirect ke PWA
          rm -rf www/*
          cat > www/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap:">
              <title>Toko App</title>
              <style>
                  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0f172a; }
                  iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
              </style>
          </head>
          <body>
              <iframe id="pwa-frame" src="about:blank"></iframe>
              <script>
                  document.addEventListener('deviceready', function() {
                      var url = 'PWA_URL_PLACEHOLDER';
                      document.getElementById('pwa-frame').src = url;
                  }, false);
                  // Fallback kalau deviceready tidak fire (test di browser)
                  setTimeout(function() {
                      var frame = document.getElementById('pwa-frame');
                      if (frame.src === 'about:blank') {
                          frame.src = 'PWA_URL_PLACEHOLDER';
                      }
                  }, 1000);
              </script>
          </body>
          </html>
          HTMLEOF
          
          # Ganti placeholder dengan URL asli
          sed -i "s|PWA_URL_PLACEHOLDER|${{ steps.url.outputs.url }}|g" www/index.html
          
          echo "✅ Config & www ready"
          cat config.xml
          echo "---"
          cat www/index.html

      - name: ➕ Add Android Platform
        run: |
          cd /tmp/tokoapp
          cordova platform add android@12.0.0
          echo "✅ Android platform added"

      - name: 📝 Copy Keystore ke Cordova
        run: |
          cp android.keystore /tmp/tokoapp/android.keystore
          cd /tmp/tokoapp
          cat > build-extras.gradle << 'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file("android.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          cp build-extras.gradle platforms/android/build-extras.gradle
          echo "✅ Keystore & build-extras.gradle copied"

      - name: 🔨 Build APK (Cordova)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          cd /tmp/tokoapp
          cordova build android --release -- --packageType=apk

      - name: 📦 Prepare output
        run: |
          mkdir -p output
          cd /tmp/tokoapp
          find platforms/android -name "*.apk" -type f
          
          if [ -f platforms/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp platforms/android/app/build/outputs/apk/release/app-release.apk "/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/output/tokoapp-${{ steps.version.outputs.VERSION_NAME }}.apk"
          elif [ -f platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk "/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/output/tokoapp-${{ steps.version.outputs.VERSION_NAME }}-unsigned.apk"
          fi
          
          ls -lh "/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/output/" || true

      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tokoapp-apk-${{ steps.version.outputs.VERSION_NAME }}
          path: output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f android.keystore /tmp/tokoapp/android.keystore
