name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  CORDOVA_VERSION: '12.0.0'
  CORDOVA_ANDROID_VERSION: '12.0.1'
  GRADLE_VERSION: '8.7'
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_HOME: /home/runner/android-sdk
  CMDLINE_TOOLS_VERSION: '11076708'
  GRADLE_HOME: /opt/gradle

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 📦 Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🤖 Setup Android SDK (Manual)
        run: |
          set -e
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          echo "✅ Command-line tools extracted"

      - name: 📜 Accept licenses & Install packages
        run: |
          set -e
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "✅ SDK packages installed"

      - name: 🎯 Install Gradle ${{ env.GRADLE_VERSION }} (Override System)
        run: |
          set -e
          echo "📥 Downloading Gradle ${{ env.GRADLE_VERSION }}..."
          cd /tmp
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O gradle.zip
          sudo unzip -q gradle.zip -d /opt
          sudo mv /opt/gradle-${GRADLE_VERSION} /opt/gradle
          sudo chmod +x /opt/gradle/bin/gradle
          
          # Verify
          /opt/gradle/bin/gradle --version
          
          echo "🗑️ Removing system Gradle 9.x to force 8.7..."
          sudo rm -rf /usr/share/gradle-* || true
          sudo rm -f /usr/bin/gradle || true
          sudo rm -f /usr/local/bin/gradle || true
          
          # Symlink /usr/local/bin/gradle → /opt/gradle/bin/gradle
          sudo ln -sf /opt/gradle/bin/gradle /usr/local/bin/gradle
          
          echo "🔍 Which gradle:"
          which gradle
          gradle --version

      - name: 🔧 Install Cordova
        run: |
          npm install -g cordova@${{ env.CORDOVA_VERSION }}
          cordova --version
          echo "✅ Cordova installed"

      - name: 🔐 Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ KEYSTORE_BASE64 belum di-set!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          ls -lh android.keystore

      - name: 🔢 Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
            VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{print $1*10000 + $2*100 + $3}')
          else
            VERSION_NAME="1.0.0"
            VERSION_CODE="1"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📱 Version: $VERSION_NAME ($VERSION_CODE)"

      - name: 🌐 Detect Pages URL
        id: url
        run: |
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          REPO_NAME="${REPO##*/}"
          if [ "$REPO_NAME" = "$OWNER.github.io" ]; then
            URL="https://${OWNER}.github.io/"
          else
            URL="https://${OWNER}.github.io/${REPO_NAME}/"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "📱 PWA URL: $URL"

      - name: 🏗️ Create Cordova Project
        run: |
          set -e
          cd /tmp
          rm -rf tokoapp
          cordova create tokoapp com.tokoapp.pwa TokoApp
          echo "✅ Project created"

      - name: 📝 Configure Cordova for PWA
        run: |
          cd /tmp/tokoapp
          
          cat > config.xml << XMLEOF
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.tokoapp.pwa" version="${{ steps.version.outputs.VERSION_NAME }}" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Toko App</name>
              <description>Toko App PWA</description>
              <author email="dev@example.com" href="https://example.com">Developer</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="Orientation" value="portrait" />
              <preference name="BackgroundColor" value="0xFF0F172A" />
              <preference name="StatusBarBackgroundColor" value="#0f172a" />
              <preference name="StatusBarStyle" value="lightcontent" />
              <preference name="Fullscreen" value="false" />
              <preference name="AndroidInsecureFileModeEnabled" value="true" />
              <preference name="GradlePluginKotlinEnabled" value="false" />
              <preference name="GradlePluginGoogleServicesEnabled" value="false" />
              <preference name="AndroidGradlePluginVersion" value="8.1.4" />
              <preference name="GradleVersion" value="${{ env.GRADLE_VERSION }}" />
          </widget>
          XMLEOF
          
          rm -rf www/*
          cat > www/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
              <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap:">
              <title>Toko App</title>
              <style>
                  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0f172a; }
                  iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
              </style>
          </head>
          <body>
              <iframe id="pwa-frame" src="PWA_URL_PLACEHOLDER"></iframe>
          </body>
          </html>
          HTMLEOF
          
          sed -i "s|PWA_URL_PLACEHOLDER|${{ steps.url.outputs.url }}|g" www/index.html
          echo "✅ Config & www ready"

      - name: ➕ Add Android Platform
        run: |
          cd /tmp/tokoapp
          cordova platform add android@${{ env.CORDOVA_ANDROID_VERSION }}
          echo "✅ Android platform added"

      - name: 📝 Setup Signing Config
        run: |
          cp android.keystore /tmp/tokoapp/android.keystore
          cd /tmp/tokoapp
          
          cat > build-extras.gradle << 'GRADLEEOF'
          android {
              signingConfigs {
                  release {
                      storeFile file("../android.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLEEOF
          
          cp build-extras.gradle platforms/android/app/build-extras.gradle
          echo "✅ build-extras.gradle placed"

      - name: 📝 Force Gradle Version (Wrapper)
        run: |
          cd /tmp/tokoapp/platforms/android
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'WRAPPEREOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          WRAPPEREOF
          echo "✅ Wrapper set to 8.7"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: 🔨 Build APK (Cordova)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GRADLE_USER_HOME: /tmp/gradle-home
          GRADLE_HOME: /opt/gradle
        run: |
          # PATH: prioritaskan /opt/gradle/bin paling depan
          export PATH="/opt/gradle/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          
          echo "🔍 Which gradle:"
          which gradle
          gradle --version
          
          cd /tmp/tokoapp
          echo "🔨 Building APK with Cordova..."
          cordova build android --release -- --packageType=apk
          
          echo "📦 APK files found:"
          find platforms/android -name "*.apk" -type f

      - name: 📦 Prepare output
        if: success()
        run: |
          mkdir -p output
          REPO_PATH="/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}"
          
          if [ -f /tmp/tokoapp/platforms/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp /tmp/tokoapp/platforms/android/app/build/outputs/apk/release/app-release.apk "$REPO_PATH/output/tokoapp-${{ steps.version.outputs.VERSION_NAME }}.apk"
            echo "✅ APK copied"
          elif [ -f /tmp/tokoapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp /tmp/tokoapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk "$REPO_PATH/output/tokoapp-${{ steps.version.outputs.VERSION_NAME }}-unsigned.apk"
            echo "✅ Unsigned APK copied"
          else
            echo "⚠️ No APK found"
          fi
          
          ls -lh "$REPO_PATH/output/" || true

      - name: ⬆️ Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tokoapp-apk-${{ steps.version.outputs.VERSION_NAME }}
          path: output/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f android.keystore /tmp/tokoapp/android.keystore