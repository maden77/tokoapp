name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  BUBBLEWRAP_VERSION: '1.21.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 Install Bubblewrap
        run: npm install -g @bubblewrap/cli@${{ env.BUBBLEWRAP_VERSION }}

      - name: 🔐 Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ KEYSTORE_BASE64 belum di-set!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          ls -lh android.keystore

      - name: 🔢 Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
            VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{print $1*10000 + $2*100 + $3}')
          else
            VERSION_NAME="1.0.0"
            VERSION_CODE="1"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📱 Version: $VERSION_NAME ($VERSION_CODE)"

      - name: 🌐 Detect Pages URL
        id: url
        run: |
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          REPO_NAME="${REPO##*/}"
          if [ "$REPO_NAME" = "$OWNER.github.io" ]; then
            URL="https://${OWNER}.github.io/"
          else
            URL="https://${OWNER}.github.io/${REPO_NAME}/"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "📱 PWA URL: $URL"

      - name: 📝 Generate twa-manifest.json
        run: |
          PKG="com.${{ github.repository_owner }}.tokoapp"
          PKG=$(echo "$PKG" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9.')

          cat > twa-manifest.json << EOF
          {
            "packageId": "$PKG",
            "host": "${{ github.repository_owner }}.github.io",
            "name": "Toko App",
            "launcherName": "TokoApp",
            "display": "standalone",
            "themeColor": "#6366f1",
            "backgroundColor": "#0f172a",
            "startUrl": "${{ steps.url.outputs.url }}",
            "iconUrl": "${{ steps.url.outputs.url }}icon-512.png",
            "webManifestUrl": "${{ steps.url.outputs.url }}manifest.json",
            "appVersionName": "${{ steps.version.outputs.VERSION_NAME }}",
            "appVersionCode": ${{ steps.version.outputs.VERSION_CODE }},
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableNotifications": false,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "appVersion": "${{ steps.version.outputs.VERSION_NAME }}"
          }
          EOF
          cat twa-manifest.json

      - name: 🏗️ Init Bubblewrap
        run: |
          mkdir -p android-build && cd android-build
          cp ../twa-manifest.json ./
          cp ../android.keystore ./
          bubblewrap init --manifest=twa-manifest.json --directory=./

      - name: 🔨 Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android-build
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath=./android.keystore \
            --signingKeyAlias="$KEY_ALIAS" \
            --password="$KEYSTORE_PASSWORD"

      - name: 📦 Prepare output
        run: |
          cd android-build
          mkdir -p ../output

          if [ -f app-release-signed.apk ]; then
            cp app-release-signed.apk "../output/tokoapp-${{ steps.version.outputs.VERSION_NAME }}.apk"
          elif [ -f app-release-unsigned.apk ]; then
            cp app-release-unsigned.apk "../output/tokoapp-${{ steps.version.outputs.VERSION_NAME }}-unsigned.apk"
          fi

          if [ -f app-release-bundle.aab ]; then
            cp app-release-bundle.aab "../output/tokoapp-${{ steps.version.outputs.VERSION_NAME }}.aab"
          fi

          ls -lh ../output/

      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tokoapp-apk-${{ steps.version.outputs.VERSION_NAME }}
          path: output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: ⬆️ Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tokoapp-aab-${{ steps.version.outputs.VERSION_NAME }}
          path: output/*.aab
          retention-days: 30
          if-no-files-found: warn

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f android.keystore android-build/android.keystore