<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; connect-src 'self' https://gutendex.com; object-src 'none'; frame-ancestors 'none';">
<link rel="manifest" href="manifest.json">
<title>📚 Perpustakaan — Toko App</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#0f172a; --text:#fff; --text-dim:#94a3b8; --border:rgba(255,255,255,.1); --primary:#6366f1; --accent:#a855f7; }
  html, body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:linear-gradient(135deg,var(--bg),#1e293b); color:var(--text); min-height:100vh; }
  .topbar { display:flex; align-items:center; gap:12px; padding:16px 20px; padding-top:calc(16px + env(safe-area-inset-top,0px)); background:rgba(15,23,42,.95); position:sticky; top:0; z-index:10; border-bottom:1px solid var(--border); }
  .back { background:rgba(255,255,255,.1); border:none; color:#fff; width:38px; height:38px; border-radius:10px; font-size:18px; cursor:pointer; }
  .topbar h1 { font-size:18px; }
  .search-wrap { display:flex; gap:8px; margin:12px 20px 0; }
  .search { flex:1; padding:12px 16px; background:rgba(255,255,255,.08); border:1px solid var(--border); border-radius:12px; color:#fff; font-size:15px; outline:none; }
  .search::placeholder { color:#64748b; }
  .btn-search { padding:0 20px; background:linear-gradient(135deg,#6366f1,#a855f7); border:none; border-radius:12px; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .container { padding:16px 20px 40px; }
  .book-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:16px; }
  .book-card { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:14px; overflow:hidden; cursor:pointer; transition:transform .15s; display:flex; flex-direction:column; }
  .book-card:active { transform:scale(.98); }
  .book-cover { width:100%; aspect-ratio:2/3; background:linear-gradient(135deg,#1e293b,#334155); display:flex; align-items:center; justify-content:center; color:#64748b; font-size:32px; overflow:hidden; }
  .book-cover img { width:100%; height:100%; object-fit:cover; }
  .book-info { padding:12px; flex:1; display:flex; flex-direction:column; }
  .book-title { font-size:14px; font-weight:600; margin-bottom:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .book-author { font-size:12px; color:var(--text-dim); display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .book-lang { font-size:11px; color:#a5b4fc; margin-top:6px; }
  .loading { text-align:center; color:var(--text-dim); padding:40px 0; font-size:14px; grid-column:1/-1; }
  .error { text-align:center; color:#f87171; padding:40px 20px; font-size:14px; grid-column:1/-1; }
  .empty { text-align:center; color:#64748b; padding:40px 20px; font-size:14px; grid-column:1/-1; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:1000; display:none; align-items:flex-end; justify-content:center; }
  .modal-overlay.show { display:flex; }
  .modal-sheet { background:var(--bg); border-top-left-radius:20px; border-top-right-radius:20px; width:100%; max-width:500px; max-height:80vh; overflow-y:auto; padding:24px; padding-bottom:calc(24px + env(safe-area-inset-bottom,0px)); }
  .modal-sheet h2 { font-size:20px; margin-bottom:8px; }
  .modal-author { color:var(--text-dim); font-size:14px; margin-bottom:20px; }
  .modal-cover { width:120px; height:180px; border-radius:10px; margin:0 auto 20px; overflow:hidden; background:linear-gradient(135deg,#1e293b,#334155); display:flex; align-items:center; justify-content:center; font-size:40px; color:#64748b; }
  .modal-cover img { width:100%; height:100%; object-fit:cover; }
  .modal-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:14px; }
  .modal-row:last-child { border-bottom:none; }
  .modal-row .label { color:var(--text-dim); }
  .modal-actions { margin-top:20px; display:flex; flex-direction:column; gap:10px; }
  .modal-btn { width:100%; padding:14px; background:linear-gradient(90deg,#6366f1,#a855f7); border:none; border-radius:12px; color:#fff; font-size:15px; font-weight:600; cursor:pointer; text-decoration:none; text-align:center; }
  .modal-btn.secondary { background:rgba(255,255,255,.1); }
  .close-modal { width:100%; margin-top:10px; padding:12px; background:transparent; border:1px solid rgba(255,255,255,.15); border-radius:12px; color:#94a3b8; font-size:14px; cursor:pointer; }
</style>
</head>
<body>

<div class="topbar">
  <button class="back" onclick="location.href='index.html'">←</button>
  <h1>📚 Perpustakaan</h1>
</div>

<div class="search-wrap">
  <input class="search" id="searchInput" placeholder="🔍 Cari judul atau penulis..." autocomplete="off">
  <button class="btn-search" id="btnSearch">Cari</button>
</div>

<div class="container">
  <div class="book-grid" id="bookGrid">
    <div class="loading">Memuat buku...</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<script>
'use strict';

const API_BASE = 'https://gutendex.com';
const $ = (s) => document.querySelector(s);

let currentPage = 1;
let totalPages = 1;
let currentQuery = '';

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function searchBooks(query, page = 1) {
  $('#bookGrid').innerHTML = '<div class="loading">Memuat buku...</div>';
  currentQuery = query;
  currentPage = page;

  try {
    let url = API_BASE + '/books';
    const params = new URLSearchParams();
    if (query) params.set('search', query);
    params.set('page', page);
    params.set('languages', 'en,id');
    url += '?' + params.toString();

    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    totalPages = Math.ceil(data.count / 32);
    renderBooks(data.results);
    renderPagination();
  } catch (err) {
    console.error(err);
    $('#bookGrid').innerHTML = '<div class="error">Gagal memuat. Cek koneksi internet.</div>';
  }
}

function renderBooks(books) {
  if (!books.length) {
    $('#bookGrid').innerHTML = '<div class="empty">Buku tidak ditemukan.</div>';
    return;
  }
  $('#bookGrid').innerHTML = books.map((b, idx) => {
    const author = b.authors[0] ? b.authors[0].name : 'Tidak diketahui';
    const cover = b.formats['image/jpeg'] || '';
    const lang = (b.languages || []).join(', ').toUpperCase();
    return `
      <div class="book-card" data-idx="${idx}">
        <div class="book-cover">
          ${cover ? `<img src="${cover}" alt="" loading="lazy" onerror="this.parentElement.textContent='📕'">` : '📕'}
        </div>
        <div class="book-info">
          <div class="book-title">${escapeHtml(b.title)}</div>
          <div class="book-author">${escapeHtml(author)}</div>
          <div class="book-lang">${lang}</div>
        </div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('.book-card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = Number(card.dataset.idx);
      showBookDetail(window._currentBooks[idx]);
    });
  });
  window._currentBooks = books;
}

function renderPagination() {
  // Simple pagination info (bisa ditambah tombol prev/next kalau perlu)
}

async function showBookDetail(book) {
  const author = book.authors[0] ? book.authors[0].name : 'Tidak diketahui';
  const cover = book.formats['image/jpeg'] || '';
  const textUrl = book.formats['text/plain; charset=us-ascii'] || book.formats['text/plain'] || '';
  const htmlUrl = book.formats['text/html'] || '';
  const epubUrl = book.formats['application/epub+zip'] || '';

  $('#modalSheet').innerHTML = `
    <div class="modal-cover">${cover ? `<img src="${cover}" alt="">` : '📕'}</div>
    <h2>${escapeHtml(book.title)}</h2>
    <div class="modal-author">oleh ${escapeHtml(author)}</div>
    <div class="modal-row"><span class="label">Bahasa</span><span>${(book.languages || []).join(', ').toUpperCase()}</span></div>
    <div class="modal-row"><span class="label">Unduhan</span><span>${book.download_count || 0}</span></div>
    <div class="modal-row"><span class="label">Topik</span><span>${(book.subjects || []).slice(0, 2).join(', ') || '-'}</span></div>
    <div class="modal-actions">
      ${epubUrl ? `<a class="modal-btn" href="${epubUrl}" target="_blank" rel="noopener">📱 Baca ePub</a>` : ''}
      ${htmlUrl ? `<a class="modal-btn secondary" href="${htmlUrl}" target="_blank" rel="noopener">🌐 Baca Online (HTML)</a>` : ''}
      ${textUrl ? `<a class="modal-btn secondary" href="${textUrl}" target="_blank" rel="noopener">📄 Baca Teks</a>` : ''}
      ${!epubUrl && !htmlUrl && !textUrl ? '<div style="text-align:center;color:#94a3b8;font-size:14px;padding:20px;">Format buku tidak tersedia.</div>' : ''}
    </div>
    <button class="close-modal" onclick="closeModal()">Tutup</button>
  `;
  $('#modalOverlay').classList.add('show');
}

function closeModal() {
  $('#modalOverlay').classList.remove('show');
}

// ---------- Events ----------
$('#btnSearch').addEventListener('click', () => {
  searchBooks($('#searchInput').value.trim(), 1);
});

$('#searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchBooks($('#searchInput').value.trim(), 1);
});

$('#modalOverlay').addEventListener('click', (e) => {
  if (e.target === $('#modalOverlay')) closeModal();
});

// ---------- Init: tampilkan buku populer ----------
searchBooks('', 1);
</script>
</body>
</html>
